name: Gerar IPA 3105 pt-BR compativel

on: workflow_dispatch

jobs:

  build:
  
    runs-on: macos-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Verificar Xcode e SDK
      
        run: |
        
          xcodebuild -version
          
          xcrun --sdk iphoneos --show-sdk-path
          
          xcrun --sdk iphoneos --show-sdk-version
          
          - name: Descompactar fonte
        run: |
          set -euo pipefail
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Arquivos ZIP encontrados:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print

          ZIP_PATH="$GITHUB_WORKSPACE/3105-ptbr-compativel-fonte.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Não encontrei 3105-ptbr-compativel-fonte.zip na raiz deste commit."
            exit 1
          fi

          EXTRACT_DIR="$GITHUB_WORKSPACE/extracted-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -qo "$ZIP_PATH" -d "$EXTRACT_DIR"

          SOURCE_ROOT=$(find "$EXTRACT_DIR" -type d \( \
            -name '3105-public-build-20260918' -o \
            -name '3105_codigo_publico' \
          \) -print -quit)

          if [ -z "$SOURCE_ROOT" ]; then
            echo "::error::O ZIP foi encontrado, mas não contém a pasta-fonte esperada."
            exit 1
          fi

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          ls -la "$SOURCE_ROOT"

          
      - name: Compilar sem assinatura
      
        run: |
        
          cd "$SOURCE_ROOT"
          
          PROJECT=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
          
          test -n "$PROJECT"
          
          xcodebuild -project "$PROJECT" -target 3105 -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" IPHONEOS_DEPLOYMENT_TARGET=16.0 ONLY_ACTIVE_ARCH=NO ARCHS="arm64" SYMROOT="$GITHUB_WORKSPACE/build" clean build 2>&1 | tail -80
          
      - name: Montar IPA
      
        run: |
        
          app=$(find . -path '*/Release-iphoneos/*.app' -type d -print -quit)
          
          echo "App encontrado: $app"
          
          test -n "$app"
          
          ls -la "$app/"
          
          mkdir -p Payload
          
          cp -R "$app" Payload/
          
          zip -qr 3105-ptbr-compativel.ipa Payload
          
          ls -lh 3105-ptbr-compativel.ipa
          
      - uses: actions/upload-artifact@v4
      
        with:
        
          name: 3105-ptbr-compativel-ipa
          
          path: 3105-ptbr-compativel.ipa
          




































